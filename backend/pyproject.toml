[project]
name = "learn-nodes-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.7",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.51.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.15.2",
    "mcp==2.2.0",
]
[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
]
build = [
    "pyinstaller>=6.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "real_agents: talks to real, logged-in ACP agents; opt in with LEARN_NODES_REAL_AGENTS=1",
]
